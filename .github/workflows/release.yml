name: Release

on:
  push:
    # 業務動機：僅在明確推送以 'v' 開頭的版本標籤 (如 v0.2.1) 時觸發正式發布流程，避免日常開發 commit 頻繁觸發重量級編譯
    tags:
      - 'v*'

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Run tests
        # 業務動機：在編譯跨平台二進位檔前先完整執行測試，確保發布之程式碼品質無誤
        run: cargo test --all-features

  build:
    name: Build binaries
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: linux-arm64
          # 業務動機：提供標準 64 位元 Windows (Intel/AMD) 二進位構建，支援最廣泛的 Windows 用戶群
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            suffix: win-x64
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            suffix: win-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            suffix: darwin-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            suffix: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache: false

      - name: Install Linux ARM64 linker
        if: ${{ matrix.target == 'aarch64-unknown-linux-gnu' }}
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare asset
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            cp target/${{ matrix.target }}/release/mcp-cli.exe dist/mcp-cli-${{ matrix.suffix }}.exe
          else
            cp target/${{ matrix.target }}/release/mcp-cli dist/mcp-cli-${{ matrix.suffix }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.suffix }}
          path: dist/

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-raw

      - name: Flatten artifacts & Generate checksums
        run: |
          mkdir -p dist
          find dist-raw -type f -exec cp {} dist/ \;
          cd dist
          sha256sum * > checksums.txt

      - name: Get version from tag
        id: version
        # 業務動機：從 GITHUB_REF (refs/tags/vX.Y.Z) 提取版本名稱，供 GitHub Release 標題使用
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        # 業務動機：自動將各大平台產出的二進位檔與校驗雜湊檔案上傳至 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            dist/mcp-cli-linux-x64
            dist/mcp-cli-linux-arm64
            dist/mcp-cli-win-x64.exe
            dist/mcp-cli-win-arm64.exe
            dist/mcp-cli-darwin-x64
            dist/mcp-cli-darwin-arm64
            dist/checksums.txt
